name: Deploy Naija Life to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax and 3D files
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --input-type=module --check < js/three-world.js
          node --input-type=module --check < js/vendor/three.module.js
          node --check scripts/verify-production-3d.mjs
          test -s js/world3d.js
          test -s js/three-world.js
          test -s js/vendor/three.module.js
          if grep -q 'cdn.jsdelivr.net/npm/three@' js/three-world.js; then
            echo "The 3D renderer still imports Three.js from an external CDN."
            exit 1
          fi
      - name: Install headless browser for production verification
        run: |
          npm install --prefix "$RUNNER_TEMP/naija-life-renderer-smoke" --no-save playwright@1.56.1
          "$RUNNER_TEMP/naija-life-renderer-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed 3D renderer
        env:
          NAIJA_SCREENSHOT_DIR: ${{ runner.temp }}/naija-life-3d-screenshots
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/naija-life-renderer-smoke/node_modules/playwright/index.mjs" node scripts/verify-production-3d.mjs
      - name: Save live 3D visual checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abuja-live-3d-visual-checkpoints
          path: ${{ runner.temp }}/naija-life-3d-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

