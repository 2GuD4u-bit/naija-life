<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162033"><title>NAIJA LIFE — make your way</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><canvas id="world" aria-label="Naija Life game world"></canvas><div class="night" id="night"></div><div class="rain" id="rain"></div>
<header class="hud"><div class="brand"><span class="brand-mark">N</span><span>NAIJA <b>LIFE</b><small id="district">Wuse District</small></span></div><div class="hud-center"><span id="clock">MON · 8:00 AM</span><span class="divider"></span><span id="weather">☀ Sunny</span><span class="divider"></span><span id="mood">🙂 Feeling good</span></div><button class="money" id="money">₦8,500 <span>＋</span></button></header>
<section class="goal-card" id="goal-card"><small>YOUR STORY</small><strong id="mission-title">New in town</strong><p id="mission-text">Use WASD or arrow keys to explore.</p><button id="mission-action">Mission details ↗</button></section>
<section class="stat-card"><div class="portrait" id="portrait">🧑🏾</div><div class="meters" id="meters"></div></section>
<section class="minimap-card"><div class="mini-title">CITY MAP <span id="mini-weather">ABUJA</span></div><canvas id="minimap" width="180" height="120"></canvas></section>
<div class="interact-hint" id="hint"></div><div class="toast" id="toast"></div>
<nav class="bottom-nav"><button data-panel="home" class="selected"><span>⌂</span>Home</button><button data-panel="map"><span>⌖</span>Map</button><button data-panel="phone"><span>▣</span>Phone <i id="phone-badge">2</i></button><button data-panel="inventory"><span>▤</span>Bag</button><button data-panel="save"><span>⚙</span>Save</button></nav>
<div class="panel-shade hidden" id="shade"><section class="panel-window" id="panel-window"><button class="close" id="close-panel">×</button><div id="panel-content"></div></section></div>
<div class="start-screen" id="start-screen"><div class="start-card"><div class="logo-large"><span>👑</span><h1>NAIJA <b>LIFE</b></h1><p>Make your way in the capital.</p></div><div id="start-form"><label>Choose your name<input id="name-input" maxlength="20" value="Amara" autocomplete="off"></label><div class="creator-row"><label>Character<select id="gender"><option value="woman">Woman</option><option value="man">Man</option></select></label><label>Skin tone<select id="skin"><option value="dark">Deep brown</option><option value="medium">Warm brown</option><option value="light">Light brown</option></select></label></div><div class="creator-row"><label>Hair<select id="hair"><option value="curls">Short curls</option><option value="braids">Braids</option><option value="fade">Fresh fade</option></select></label><label>Outfit<select id="outfit"><option value="green">Everyday green</option><option value="coral">Coral shirt</option><option value="blue">Blue kaftan</option></select></label></div><button class="start-button" id="new-game">Start a new life →</button><button class="continue-button" id="continue-game">Continue saved life</button></div><small class="disclaimer">An original fictional Nigerian city life game.</small></div></div>
<div class="controls-note" id="controls-note">WASD move · E interact · F enter/exit car · G crime · Shift run</div></main>
<script src="js/state.js"></script><script src="js/world.js"></script><script src="js/world3d.js"></script><script src="js/player.js"></script><script src="js/systems.js"></script><script src="js/ui.js"></script><script src="js/payments.js"></script><script src="js/main.js"></script></body></html>
